<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 2vmin;
      display: flex;
      flex-direction: column;
      gap: 1.5vmin;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1b1c1e;
    }
    h1 {
      margin: 0;
      font-size: clamp(1rem, 3.2vmin, 1.6rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 1fr;
      gap: 1.5vmin;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.5em;
      border-radius: 1.4vmin;
      background: #ffffff;
      border: 1px solid #d9dce1;
      color: #1b1c1e;
      text-decoration: none;
      font-size: clamp(0.85rem, 2.4vmin, 1.4rem);
      font-weight: 500;
      line-height: 1.2;
      overflow-wrap: anywhere;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    a:hover, a:focus-visible {
      background: #e8f0fe;
      border-color: #4a80d8;
    }
    a:active { transform: scale(0.98); }
    @media (max-aspect-ratio: 1/1) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #131417; color: #eceef1; }
      a { background: #1e2025; border-color: #33363d; color: #eceef1; }
      a:hover, a:focus-visible { background: #26303f; border-color: #5b8ddd; }
    }
  </style>
</head>
<body>
  <h1>Links</h1>
  <div class="grid">
    <a href="https://ntulearn.ntu.edu.sg/ultra/course">ntulearn</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705936_1/outline">ma1008 lecture</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705946_1/outline">ma1008 tutorial</a>

    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705977_1/outline">ma2002 tut</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2706025_1/outline">ma2006 lec</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2706029_1/outline">ma2006 tut</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705919_1/outline">ma0218 lec</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705920_1/outline">ma0218 tut</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2712766_1/outline">ma2015 lec</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2708927_1/outline">cl0105 lec</a>
    <a href="https://ntulearn.ntu.edu.sg/ultra/courses/_2711935_1/outline">cl0105 le26</a>

</body>
</html>
