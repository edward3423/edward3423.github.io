<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 2vmin;
      display: flex;
      flex-direction: column;
      gap: 1.5vmin;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1b1c1e;
    }
    .grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: 1.5vmin;
    }
    .ntulearn { --hue: 220; grid-column: -2 / -1; grid-row: 1; }
    .ma1008 { --hue: 0; }
    .ma2002 { --hue: 30; }
    .ma2006 { --hue: 50; }
    .ma0218 { --hue: 140; }
    .ma2015 { --hue: 175; }
    .cl0105 { --hue: 275; }
    .cc0007 { --hue: 320; }
    a {
      --hue: 220;
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.5em;
      border-radius: 1.4vmin;
      background: hsl(var(--hue) 70% 95%);
      border: 1px solid hsl(var(--hue) 55% 78%);
      color: hsl(var(--hue) 60% 22%);
      text-decoration: none;
      font-size: clamp(0.85rem, 2.4vmin, 1.4rem);
      font-weight: 500;
      line-height: 1.2;
      overflow-wrap: anywhere;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    a:hover, a:focus-visible {
      background: hsl(var(--hue) 72% 88%);
      border-color: hsl(var(--hue) 60% 50%);
    }
    a:active { transform: scale(0.98); }
    a span { position: relative; z-index: 1; }
    .circle {
      aspect-ratio: 1 / 1;
      height: 100%;
      place-self: center;
      border-radius: 50%;
      padding: 0.4em;
    }
    .hex {
      background: none;
      border: none;
      border-radius: 0;
      padding: 0.5em 1em;
    }
    .hex::before, .hex::after {
      content: "";
      position: absolute;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }
    .hex::before {
      inset: 0;
      background: hsl(var(--hue) 55% 62%);
    }
    .hex::after {
      inset: 2px;
      background: hsl(var(--hue) 70% 95%);
    }
    .hex:hover, .hex:focus-visible { background: none; }
    .hex:hover::after, .hex:focus-visible::after { background: hsl(var(--hue) 72% 88%); }
    @media (max-aspect-ratio: 1/1) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #131417; color: #eceef1; }
      a {
        background: hsl(var(--hue) 32% 18%);
        border-color: hsl(var(--hue) 35% 34%);
        color: hsl(var(--hue) 65% 85%);
      }
      a:hover, a:focus-visible {
        background: hsl(var(--hue) 38% 26%);
        border-color: hsl(var(--hue) 55% 55%);
      }
      .hex, .hex:hover, .hex:focus-visible { background: none; }
      .hex::before { background: hsl(var(--hue) 45% 45%); }
      .hex::after { background: hsl(var(--hue) 32% 18%); }
      .hex:hover::after, .hex:focus-visible::after { background: hsl(var(--hue) 38% 26%); }
    }
  </style>
</head>
<body>
  <div class="grid">
    <a class="ntulearn" href="https://ntulearn.ntu.edu.sg/ultra/course"><span>ntulearn</span></a>
    <a class="ma1008" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705936_1/outline"><span>ma1008 lecture</span></a>
    <a class="hex ma1008" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705946_1/outline"><span>ma1008 tutorial</span></a>
    <a class="ma2002" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705969_1/outline"><span>ma2002 lecture</span></a>
    <a class="hex ma2002" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705977_1/outline"><span>ma2002 tut</span></a>
    <a class="ma2006" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2706025_1/outline"><span>ma2006 lec</span></a>
    <a class="hex ma2006" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2706029_1/outline"><span>ma2006 tut</span></a>
    <a class="ma0218" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705919_1/outline"><span>ma0218 lec</span></a>
    <a class="hex ma0218" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2705920_1/outline"><span>ma0218 tut</span></a>
    <a class="ma2015" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2712766_1/outline"><span>ma2015 lec</span></a>
    <a class="cl0105" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2708927_1/outline"><span>cl0105 lec</span></a>
    <a class="hex cl0105" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2711935_1/outline"><span>cl0105 le26</span></a>
    <a class="cc0007" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2706844_1/outline"><span>cc0007 lec</span></a>
    <a class="hex cc0007" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2706936_1/outline"><span>cc0007 class</span></a>
    <a class="circle cc0007" href="https://ntulearn.ntu.edu.sg/ultra/courses/_2706939_1/outline"><span>cc0007 cluster</span></a>
  </div>
</body>
</html>
